<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>היום של יעל</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15112b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יעל">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15112b; --panel:#231c45; --panel2:#2d2560; --line:#4a3f8f;
    --text:#f4f1ff; --muted:#b9b0e6; --accent:#f5c04a; --accent-dark:#5a3d00;
    --good:#5dcaa5; --bad:#f06a6a; --purple:#7f77dd;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,sans-serif;height:100%}
  body{display:flex;justify-content:center;min-height:100vh;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  /* scroll fix 24.11.2026: page scrolls on every screen except the game itself */
  html.lock,html.lock body{overflow:hidden;touch-action:none;overscroll-behavior:none}
  #app{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;padding:12px 12px 16px}
  #hud{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:10px;font-weight:700;font-size:15px}
  #hud .hearts{display:flex;gap:6px;align-items:center}
  #hud canvas{display:block}
  #btnMute{width:34px;height:30px;padding:0;margin:0;font-size:16px;line-height:1;background:var(--panel2);border-bottom:3px solid #1a1440;border-radius:5px}
  #btnMute.off{opacity:.55}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex}
  .card{background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:16px}
  h1{font-size:30px;font-weight:900;margin:0 0 4px;letter-spacing:.5px}
  h2{font-size:22px;font-weight:900;margin:0 0 8px}
  p{margin:0 0 8px;line-height:1.5;font-size:16px}
  .muted{color:var(--muted);font-size:14px}
  button{font-family:inherit;font-size:18px;font-weight:900;color:var(--accent-dark);background:var(--accent);border:0;border-bottom:5px solid #a67a1e;border-radius:6px;padding:12px 18px;width:100%;cursor:pointer;margin-top:10px}
  button:active{transform:translateY(3px);border-bottom-width:2px}
  button.ghost{background:var(--panel2);color:var(--text);border-bottom-color:#1a1440}
  .center{text-align:center}
  .pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:0 auto}
  /* map */
  .chapter{display:flex;align-items:center;gap:12px;background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
  .chapter.locked{opacity:.55;cursor:default}
  .chapter.done{border-color:var(--good)}
  .chapter .icon{width:48px;height:48px;background:var(--panel2);border-radius:4px;display:flex;align-items:center;justify-content:center;flex:none}
  .chapter .t{font-weight:900;font-size:17px}
  .chapter .s{color:var(--muted);font-size:13px}
  .chapter .tag{margin-inline-start:auto;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
  .chapter.done .tag{color:var(--good)}
  /* dialog */
  .bubble{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:12px;min-height:120px}
  .bubble .who{font-weight:900;color:var(--accent);font-size:14px;margin-bottom:4px}
  .bubble .line{font-size:18px;line-height:1.45;font-weight:700}
  .portrait{width:64px;height:64px;background:var(--panel2);border-radius:4px;display:flex;align-items:flex-start;justify-content:center;flex:none;overflow:hidden}
  .scene{flex:1;display:flex;align-items:center;justify-content:center;min-height:120px;max-width:100%;overflow:hidden}
  /* final message (Nitzan, 25.11.2026): his photo, the text is typed into the empty box drawn in the photo */
  #finalCard{position:relative;width:min(100%, calc((100vh - 150px) * 0.5628));aspect-ratio:941/1672;margin:0 auto 12px}
  #finalImg{display:block;width:100%;height:100%;border-radius:6px}
  #finalText{position:absolute;left:9.5%;right:9.5%;top:70.6%;bottom:10%;overflow:hidden;direction:rtl;text-align:right;white-space:pre-line;color:#f4f1ff;font-weight:700;line-height:1.45;font-size:14px}
  #finalText .reveal{color:#f5c04a}
  #s-final #btnFinalMap{align-self:center}
  .scene>div{max-width:100%;flex-wrap:nowrap}
  /* title screen (25.11.2026) */
  #titleCv{display:block;width:100%;aspect-ratio:270/324;border:3px solid var(--line);border-radius:6px;background:#15112b}
  /* play */
  #playwrap{flex:1;display:flex;flex-direction:column}
  #game{width:100%;aspect-ratio:3/4;border:3px solid var(--line);border-radius:6px;background:#0d0a1e;touch-action:none}
  #goal{display:flex;justify-content:space-between;font-weight:700;font-size:14px;color:var(--muted);margin-top:8px}
  #bar{height:10px;background:var(--panel2);border-radius:5px;margin-top:6px;overflow:hidden}
  #barfill{height:100%;width:0;background:var(--good);transition:width .2s}
  #barWrap{position:relative}
  #barBus{position:absolute;top:-9px;right:-12px;width:28px;height:28px;image-rendering:pixelated;display:none;pointer-events:none;transition:right .2s}
  #barIcons{display:none;justify-content:space-between;margin-top:6px;margin-bottom:-4px}
  #barIcons img{width:22px;height:22px;image-rendering:pixelated}
  #btnHorn{display:none;align-items:center;justify-content:center;gap:10px;font-size:20px;padding:14px;margin-top:12px}
  #btnHorn img{width:30px;height:30px;image-rendering:pixelated}
  #btnHorn.pressed{transform:translateY(3px);border-bottom-width:2px}
  #btnHorn.used{opacity:.45;filter:grayscale(1)}
  /* 25.11.2026, Nitzan: on a phone the driver button was below the screen. In chapter 2 the whole play column shrinks so everything fits in the screen height */
  #s-play.bus #playwrap{width:min(100%, calc((100vh - var(--busReserve)) * 0.75));align-self:center}
  @supports (height:100dvh){ #s-play.bus #playwrap{width:min(100%, calc((100dvh - var(--busReserve)) * 0.75))} }
  #s-play.bus{--busReserve:218px}
  #s-play.bus #btnHorn{font-size:18px;padding:8px;margin-top:8px}
  #s-play.bus #btnHorn img{width:26px;height:26px}
  .rules li{margin-bottom:6px;font-size:15px}
  .rules li.pic{list-style:none;display:flex;align-items:center;gap:10px;margin-inline-start:-18px;background:var(--panel2);border-radius:6px;padding:6px 8px}
  .rules li.pic img{width:84px;height:66px;image-rendering:pixelated;flex:none;background:#15112b;border-radius:4px}
  .rules{padding-inline-start:18px;margin:8px 0}
  .flash{animation:flash .5s}
  @keyframes flash{0%{background:#5a1f2e}100%{background:var(--panel)}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hearts" id="hearts"></div>
    <div id="chapterName">היום של יעל</div>
    <div style="display:flex;align-items:center;gap:8px"><div id="coins">0 ⭐</div><button id="btnMute" title="צליל" aria-label="צליל">🔊</button></div>
  </div>

  <!-- title -->
  <section class="screen on" id="s-title">
    <div id="titleScene"></div>
    <button id="btnStart">התחלה</button>
  </section>

  <!-- map -->
  <section class="screen" id="s-map">
    <h2 style="margin:4px 0 10px">המפה של היום</h2>
    <div id="mapList"></div>
    <p class="muted center" id="mapHint">לחצי על פרק פתוח כדי לשחק</p>
  </section>

  <!-- dialog -->
  <section class="screen" id="s-dialog">
    <div class="scene" id="dialogScene"></div>
    <div class="bubble" id="bubble">
      <div class="portrait" id="portrait"></div>
      <div><div class="who" id="who"></div><div class="line" id="line"></div></div>
    </div>
    <button id="btnNext">המשך</button>
  </section>

  <!-- rules -->
  <section class="screen" id="s-rules">
    <div class="card">
      <h2 id="rulesTitle"></h2>
      <ul class="rules" id="rulesList"></ul>
      <button id="btnPlay">יאללה</button>
    </div>
  </section>

  <!-- play -->
  <section class="screen" id="s-play">
    <div id="playwrap">
      <canvas id="game" width="270" height="360"></canvas>
      <div id="goal"><span id="goalText"></span><span id="goalCount"></span></div>
      <div id="barIcons"><img src="assets/ui_bus_stop.png" alt=""><img src="assets/ui_building_iryah.png" alt=""></div>
      <div id="barWrap"><div id="bar"><div id="barfill"></div></div><img id="barBus" src="assets/ui_bus_marker.png" alt=""></div>
      <button id="btnHorn"><img src="assets/ui_horn.png" alt="">נהג, סע כבר!<span id="hornLeft"></span></button>
    </div>
  </section>

  <!-- game over -->
  <section class="screen" id="s-over">
    <div class="scene" id="overScene"></div>
    <div class="card center" id="overCard">
      <h2>שלוש פסילות</h2>
      <div class="bubble" style="text-align:start;margin-bottom:6px">
        <div class="portrait" id="overPortrait"></div>
        <div><div class="who" id="overWho"></div><div class="line" id="overLine"></div></div>
      </div>
      <button id="btnRetry">נסי שוב מתחילת הפרק</button>
      <button class="ghost" id="btnOverMap">למפה</button>
    </div>
  </section>

  <!-- final message from Nitzan (after chapter 7) -->
  <section class="screen" id="s-final">
    <div id="finalCard"><img id="finalImg" src="assets/final_photo_v2.jpg" alt=""><div id="finalText"></div></div>
    <button id="btnFinalMap">למפה</button>
  </section>

  <!-- chapter done -->
  <section class="screen" id="s-done">
    <div class="scene" id="doneScene"></div>
    <div class="card center">
      <h2 id="doneTitle"></h2>
      <p id="doneText"></p>
      <button id="btnDoneMap">למפה</button>
    </div>
  </section>
</div>

<script>
/* ---------- pixel sprites ---------- */
const ART={
  yael:{poses:{ready:'assets/yael_ready.png', reach_left:'assets/yael_reach_left.png', reach_right:'assets/yael_reach_right.png', catch:'assets/yael_catch.png', recoil:'assets/yael_recoil.png', celebrate:'assets/yael_celebrate.png'}, sprite:'assets/yael_ready.png', portrait:'assets/yael_portrait.png', anchorY:0.9375, visTop:33/256},
  // dialogue/title rows use the 512px intro art (20.11.2026 proportions fix): feet at 480/512, Yael = 400px of 512 → same 0.78 ratio as the 256 gameplay frames
  nitzan:{portrait:'assets/nitzan_portrait.png', sprite:'assets/intro_nitzan.png', anchorY:0.9375, visTop:60/512, sharedScale:true, visLeft:175/512, visRight:337/512},
  chupa:{portrait:'assets/chupa_portrait.png', sprite:'assets/intro_chupa.png', anchorY:0.9375, visTop:280/512, sharedScale:true, visLeft:211/512, visRight:300/512},
  yotam:{portrait:'assets/yotam_portrait.png', sprite:'assets/intro_yotam.png', anchorY:0.9375, visTop:220/512, sharedScale:true, visLeft:208/512, visRight:304/512},
};
// chapter 4 (20.11.2026): Yael at home, full-body sprites for Nitzan/Yotam/Chupa (used in all dialogue scenes)
ART.yael.poseTop={celebrate:20/256, catch:6/256}; /* top of the drawing in these poses (ready = 33/256) */
Object.assign(ART.yael.poses, {home_idle:'assets/yael_home_idle.png', home_done:'assets/yael_home_done.png', home_fail:'assets/yael_home_fail.png'});
const POSE_IMG={}; for(const k in ART.yael.poses){ const im=new Image(); im.src=ART.yael.poses[k]; POSE_IMG[k]=im; }
/* ---------- vector characters ---------- */
const LOOKS = {
  yael:   {name:'יעל', skin:'#c98a5e', hair:'#7a2e1e', hairLight:'#a8452a', hairStyle:'curlyLong', eye:'#3b7fd6',
           shirt:'#e0a060', pattern:'leaf', patternColor:'#6f8f6a', pants:'#3a4f7a', pantsStyle:'long', shoes:'sneakers', smile:'teeth'},
  nitzan: {name:'ניצן', skin:'#d9a97c', hair:'#2a1a10', hairStyle:'short', eye:'#3a2416',
           shirt:'#378add', pattern:'plain', pants:'#444441', pantsStyle:'long', shoes:'sneakers', shoeColor:'#2c2c2a', smile:'plain'},
  yotam:  {name:'יותם', kid:true, skin:'#c98a5e', hair:'#2b1a12', hairLight:'#4a2f22', hairStyle:'curlyShort', eye:'#3a2416',
           shirt:'#1e1e1e', pattern:'pixel', pants:'#e8863a', pantsStyle:'shorts', shoes:'sandals', smile:'teeth'},
  chupa:  {name:"צ'ופה", kid:true, small:true, skin:'#d9a97c', hair:'#6b4a2a', hairStyle:'pigtails', eye:'#3a2416',
           shirt:'#ed93b1', pattern:'plain', pants:'#7f77dd', pantsStyle:'long', shoes:'sneakers', smile:'plain'},
  eti:    {name:'אטי', skin:'#d9a97c', hair:'#d3d1c7', hairStyle:'bob', eye:'#3a2416',
           shirt:'#993556', pattern:'plain', pants:'#444441', pantsStyle:'long', shoes:'sneakers', shoeColor:'#2c2c2a', smile:'plain', glasses:true},
  orit:   {name:'אורית', skin:'#d9a97c', hair:'#b4b2a9', hairStyle:'short', eye:'#3a2416',
           shirt:'#1d9e75', pattern:'plain', pants:'#444441', pantsStyle:'long', shoes:'sneakers', shoeColor:'#2c2c2a', smile:'plain'},
  dganit: {name:'דגנית', skin:'#d9a97c', hair:'#8b2f1e', hairStyle:'bob', eye:'#3a2416',
           shirt:'#ef9f27', pattern:'plain', pants:'#2c2c2a', pantsStyle:'long', shoes:'sneakers', smile:'plain'},
  lihi:   {name:'ליהי', skin:'#d9a97c', hair:'#1a1a1a', hairStyle:'long', eye:'#3a2416',
           shirt:'#5dcaa5', pattern:'plain', pants:'#2f3a5a', pantsStyle:'long', shoes:'sneakers', smile:'plain'},
};
const CHARS = LOOKS;

let _uid=0;
function charSVG(id){
  const L=LOOKS[id]; const u='u'+(_uid++);
  const kid=!!L.kid, small=!!L.small;
  const G = small ? {hx:60,hy:88,rx:23,ry:25, neckW:10,neckH:7, torso:[40,118,40,28], armY:121, armH:24, legY:146, legH:16, shoeY:168, handR:5, armX:[38,82]}
          : kid   ? {hx:60,hy:76,rx:26,ry:28, neckW:11,neckH:8, torso:[36,110,48,34], armY:114, armH:28, legY:144, legH:20, shoeY:168, handR:5.5, armX:[35,85]}
                  : {hx:60,hy:48,rx:25,ry:28, neckW:12,neckH:9, torso:[32,82,56,46], armY:86, armH:38, legY:128, legH:38, shoeY:170, handR:6.5, armX:[31,89]};
  const {hx,hy,rx,ry}=G; const [tx,ty,tw,th]=G.torso;
  const skinDark=shade(L.skin,-18), hairLight=L.hairLight||shade(L.hair,22);
  const p=[];
  const circ=(cx,cy,r,f)=>`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${f}"/>`;

  /* ---- back hair ---- */
  if(L.hairStyle==='curlyLong'){
    for(let i=0;i<7;i++){ const a=Math.PI*(1.08+i*0.14); p.push(circ(hx+(rx+7)*Math.cos(a), hy+(ry+4)*Math.sin(a), 12, L.hair)); }
    for(let y=hy-4;y<hy+62;y+=11){ const w=Math.sin(y)*3; p.push(circ(hx-rx-8+w,y,11,L.hair)); p.push(circ(hx+rx+8-w,y,11,L.hair)); }
    for(let y=hy+6;y<hy+58;y+=14){ p.push(circ(hx-rx-12,y,4,hairLight)); p.push(circ(hx+rx+12,y+5,4,hairLight)); }
  } else if(L.hairStyle==='curlyShort'){
    for(let i=0;i<9;i++){ const a=Math.PI*(1.0+i*0.125); p.push(circ(hx+(rx+5)*Math.cos(a), hy+(ry+2)*Math.sin(a), 11, L.hair)); }
    p.push(circ(hx-rx-5,hy+10,8,L.hair)); p.push(circ(hx+rx+5,hy+10,8,L.hair));
    p.push(circ(hx-14,hy-ry-4,3.5,hairLight)); p.push(circ(hx+12,hy-ry-6,3.5,hairLight)); p.push(circ(hx+rx+2,hy-8,3,hairLight));
  } else if(L.hairStyle==='bob'){
    p.push(`<rect x="${hx-rx-7}" y="${hy-ry-2}" width="${rx*2+14}" height="${ry*2+14}" rx="18" fill="${L.hair}"/>`);
  } else if(L.hairStyle==='long'){
    p.push(`<rect x="${hx-rx-6}" y="${hy-ry-2}" width="${rx*2+12}" height="${ry*2+52}" rx="16" fill="${L.hair}"/>`);
  } else if(L.hairStyle==='pigtails'){
    p.push(circ(hx-rx-7,hy-2,10,L.hair)); p.push(circ(hx+rx+7,hy-2,10,L.hair));
    p.push(circ(hx-rx-7,hy-8,4,'#f5c04a')); p.push(circ(hx+rx+7,hy-8,4,'#f5c04a'));
  }
  if(L.hairStyle==='short'||L.hairStyle==='pigtails'||L.hairStyle==='bob'||L.hairStyle==='long'){
    p.push(`<ellipse cx="${hx}" cy="${hy-5}" rx="${rx+2}" ry="${ry}" fill="${L.hair}"/>`);
  }

  /* ---- legs + shoes ---- */
  const legW=(tw-8)/2-2, lx1=tx+4, lx2=tx+tw-4-legW;
  const shoeColor = L.shoes==='sandals' ? '#7a5230' : (L.shoeColor||'#f4f4f4');
  for(const lx of [lx1,lx2]){
    const cx=lx+legW/2;
    if(L.pantsStyle==='shorts'){
      const ph=Math.round(G.legH*0.5);
      p.push(`<rect x="${lx}" y="${G.legY}" width="${legW}" height="${ph+4}" rx="4" fill="${L.pants}"/>`);
      p.push(`<rect x="${lx+2}" y="${G.legY+ph}" width="${legW-4}" height="${G.legH-ph+6}" rx="4" fill="${L.skin}"/>`);
    } else {
      p.push(`<rect x="${lx}" y="${G.legY}" width="${legW}" height="${G.legH+6}" rx="4" fill="${L.pants}"/>`);
    }
    if(L.shoes==='sandals'){
      p.push(`<ellipse cx="${cx}" cy="${G.shoeY+2}" rx="${legW/2+3}" ry="5" fill="${shoeColor}"/>`);
      p.push(`<path d="M${cx-legW/2} ${G.shoeY-2} Q${cx} ${G.shoeY-9} ${cx+legW/2} ${G.shoeY-2}" stroke="${shoeColor}" stroke-width="2.5" fill="none"/>`);
    } else {
      p.push(`<ellipse cx="${cx}" cy="${G.shoeY}" rx="${legW/2+3}" ry="6" fill="${shoeColor}"/>`);
      p.push(`<rect x="${cx-legW/2-3}" y="${G.shoeY+2}" width="${legW+6}" height="4" rx="2" fill="${shade(shoeColor,-25)}"/>`);
    }
  }

  /* ---- torso ---- */
  const torsoPath=`M${tx+8} ${ty} h${tw-16} q8 0 8 8 v${th-8} h${-tw} v${-(th-8)} q0 -8 8 -8 z`;
  p.push(`<clipPath id="${u}t"><path d="${torsoPath}"/></clipPath>`);
  p.push(`<path d="${torsoPath}" fill="${L.shirt}"/>`);
  if(L.pattern==='leaf'){
    const pc=L.patternColor||'#6f8f6a';
    for(let i=0;i<14;i++){ const x=tx+6+(i*17)%(tw-6), y=ty+4+Math.floor(i/3)*11+(i%2)*4, rot=(i*47)%180;
      p.push(`<ellipse cx="${x}" cy="${y}" rx="7" ry="2.6" fill="${pc}" transform="rotate(${rot} ${x} ${y})" clip-path="url(#${u}t)"/>`); }
  } else if(L.pattern==='pixel'){
    const cx=tx+tw/2, cy=ty+th/2-2, s=4;
    const grid=["gguugg","gyggyg","gggggg","gyyyyg"], col={g:'#5dcaa5',u:'#378add',y:'#f5c04a'};
    grid.forEach((row,r)=>[...row].forEach((ch,c)=>p.push(`<rect x="${cx-12+c*s}" y="${cy-8+r*s}" width="${s}" height="${s}" fill="${col[ch]}"/>`)));
  } else if(L.pattern==='stripes'){
    for(let y=ty+6;y<ty+th;y+=10) p.push(`<rect x="${tx}" y="${y}" width="${tw}" height="4" fill="${L.patternColor||'#ffffff'}" clip-path="url(#${u}t)"/>`);
  }
  /* ---- arms ---- */
  for(const ax of G.armX){
    p.push(`<rect x="${ax-6}" y="${G.armY}" width="12" height="16" rx="5" fill="${L.shirt}"/>`);
    p.push(`<rect x="${ax-4.5}" y="${G.armY+12}" width="9" height="${G.armH-10}" rx="4" fill="${L.skin}"/>`);
    p.push(circ(ax, G.armY+G.armH+2, G.handR, L.skin));
  }
  /* ---- neck + head ---- */
  p.push(`<rect x="${hx-G.neckW/2}" y="${hy+ry-4}" width="${G.neckW}" height="${G.neckH+6}" fill="${skinDark}"/>`);
  p.push(`<ellipse cx="${hx}" cy="${hy}" rx="${rx}" ry="${ry}" fill="${L.skin}"/>`);
  /* ears */
  p.push(`<ellipse cx="${hx-rx}" cy="${hy+2}" rx="4" ry="5.5" fill="${L.skin}"/><ellipse cx="${hx+rx}" cy="${hy+2}" rx="4" ry="5.5" fill="${L.skin}"/>`);
  /* ---- face ---- */
  const ey=hy+1, ex=[hx-9,hx+9];
  for(const x of ex){

function drawSprite(ctx, px, pal, x, y, sc){
  for(let r=0;r<px.length;r++){
    const row=px[r];
    for(let c=0;c<row.length;c++){
      const ch=row[c]; if(ch==='.') continue;
      const col=pal[ch]; if(!col) continue;
      ctx.fillStyle=col; ctx.fillRect(x+c*sc, y+r*sc, sc, sc);
    }
  }
}
function spriteCanvas(px, pal, sc){
  const w=Math.max(...px.map(r=>r.length))*sc, h=px.length*sc;
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.className='pix';
  drawSprite(cv.getContext('2d'), px, pal, 0, 0, sc);
  return cv;
}

function musicStart(song){
  sndInit(); if(!SND.ctx || SND.music) return; song=song||MUS;
  SND.music={step:0, next:SND.ctx.currentTime+0.05, mult:1, timer:0, song, alt:null, altUntil:0, altStep:0};
  const bus=SND.ctx.createGain(); bus.gain.value=0.85; bus.connect(SND.master); SND.music.bus=bus;
  const tick=()=>{
    const m=SND.music; if(!m) return; const c=SND.ctx;
    if(m.alt && c.currentTime>=m.altUntil){ m.alt=null; m.next=Math.max(m.next, c.currentTime+0.05); } // jingle over: back to the chapter loop
    const S=m.song; const spb=m.alt ? 60/m.alt.bpm/2 : 60/(S.bpm*m.mult)/2; // seconds per half-beat
    while(m.next < c.currentTime+0.25){
      if(m.alt){ const A=m.alt, j=m.altStep%A.lead.length, t=m.next;
        if(j%2===0){ const b=A.bass[(j/2)%A.bass.length]; tone('triangle', NOTE(b), NOTE(b), t, spb*1.6, 0.3, {dest:bus, lp:600}); }
        if(j%4===0) noise(t, 0.04, 0.05, 8000);
        const l=A.lead[j]; if(l){ const d=(A.len&&A.len[j])||0.9; tone('square', NOTE(l), NOTE(l), t, spb*d, 0.13, {dest:bus, lp:2600, a:0.01}); tone('triangle', NOTE(l+12), NOTE(l+12), t, spb*Math.min(d,0.6), 0.05, {dest:bus}); }
        m.next+=spb; m.altStep++; continue; }
      const i=m.step%64, t=m.next;
      if(i%2===0){ const b=S.bass[(i/2)%32]; tone('triangle', NOTE(b), NOTE(b), t, spb*1.6, 0.3, {dest:bus, lp:600}); }
      if(S.pad && i%8===0){ for(const n of S.pad[(i/8)%8]) tone('triangle', NOTE(n), NOTE(n), t, spb*7.5, 0.05, {dest:bus, lp:1400, a:0.08}); } // soft chord at the start of each bar
      if(S.bell && S.bell[i]){ tone('sine', NOTE(S.bell[i]), NOTE(S.bell[i]), t, spb*1.8, 0.06, {dest:bus, a:0.005}); } // little bell answer
      if(i%8===0) tone('sine', 110, 45, t, 0.14, 0.35, {dest:bus});           // kick
      if(i%8===4) noise(t, 0.08, 0.08, 6000);                                 // snare-ish

      const l=S.lead[i]; if(l) tone(S.leadType||'square', NOTE(l), NOTE(l), t, spb*(S.leadLen||0.9), S.leadVol||0.11, {dest:bus, lp:S.leadLp||2200, a:0.01});
      m.next+=spb; m.step++;
    }
    m.timer=setTimeout(tick, 90);
  };
  tick();
}

function finalFit(){ /* font size from the photo width; then shrink until the full letter fits the box (fonts differ between phones) */
  const c=document.getElementById('finalCard'), box=document.getElementById('finalText'); if(!c || !c.clientWidth) return;
  const m=box.cloneNode(false); m.removeAttribute('id'); m.style.cssText=getComputedStyle(box).cssText||''; m.className=''; m.setAttribute('style','position:absolute;left:9.5%;right:9.5%;top:70.6%;bottom:10%;overflow:hidden;direction:rtl;text-align:right;white-space:pre-line;font-weight:700;line-height:1.45;visibility:hidden');
  m.textContent=FINAL_MSG.parts.join(''); c.appendChild(m); let fs=c.clientWidth*0.040;
  m.style.fontSize=fs.toFixed(1)+'px'; while(m.scrollHeight>m.clientHeight+1 && fs>9){ fs-=0.5; m.style.fontSize=fs.toFixed(1)+'px'; }
  c.removeChild(m); box.style.fontSize=fs.toFixed(1)+'px'; }
window.addEventListener('resize', finalFit);
function showFinal(){
  document.getElementById('chapterName').textContent=FINAL_MSG.title;
  finalTimers.forEach(clearTimeout); finalTimers=[];
  const F=FINAL_MSG, box=document.getElementById('finalText'); box.innerHTML='';
  const a=document.createElement('span'), b=document.createElement('span'), c=document.createElement('span'); b.className='reveal'; box.append(a,b,c);
  show('s-final'); finalFit();
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ a.textContent=F.parts[0]; b.textContent=F.parts[1]; c.textContent=F.parts[2]; return; }
  const at=(ms,fn)=>finalTimers.push(setTimeout(fn,ms));
  const type=(el,txt,t0)=>{ const ch=Array.from(txt); ch.forEach((_,i)=>at(t0+i*F.letterMs,()=>{ el.textContent=ch.slice(0,i+1).join(''); })); return t0+ch.length*F.letterMs; }; /* Array.from keeps the emoji in one piece */
  let t=type(a, F.parts[0], F.startDelay);
  t+=F.beforeReveal; at(t,()=>{ b.textContent=F.parts[1]; });
  t+=F.revealHold; type(c, F.parts[2], t);
}

function loop(now){

function updateCoffee(dt){
  const c=play.coffee;
  if(c.part==='mid') return;                       // dialog screen between the parts
  if(c.part==='meeting'){                           // Yael is away; the coffee cools to meetingTemp
    c.meetT-=dt; c.temp = COFFEE.meetingTemp + (c.meetFrom-COFFEE.meetingTemp)*Math.max(0,c.meetT/COFFEE.meetingSeconds);
    if(!L3_REDUCED) for(const p of c.papers){ p.y+=p.vy*dt; p.x+=(p.vx+Math.sin(c.steam*0.7+p.r)*6)*dt; p.r+=p.vr*dt; if(p.y>300){ p.y=100; p.x=40+Math.random()*190; } }
    c.steam+=dt; updateGoal();
    if(c.meetT<=0){ c.part='mid'; runDialog(L3_MID, ['yael'], startPartB); }
    return;
  }
  if(play.pause>0) play.pause-=dt;
  // cooling never stops
  const rate = c.part==='B' ? COFFEE.coolRateB : (COFFEE.start-COFFEE.min)/COFFEE.coolSeconds;
  c.temp -= dt*rate*(c.card ? COFFEE.cardCoolMult : 1);
  if(c.card && c.card.kind!=='meeting' && play.pause<=0 && !c.correctFx){ c.card.timer-=dt; if(c.card.timer<=0){ c.card.timer=COFFEE.cardTimeout; c.temp-=COFFEE.cardTimeoutDrop; play.flash=0.4; } }
  if(c.burn>0) c.burn-=dt;
  musicTempo(c.temp<COFFEE.warnAt ? 1.12 : 1);
  if(c.temp<c.min){ coldCup(); }
  // drinking
  const canDrink = c.holding && !c.needRelease && !c.card && play.pause<=0 && c.spill<=0 && c.burn<=0;
  if(canDrink){
    c.holdT+=dt;
    if(c.holdT>COFFEE.sipMax){ c.holdT=0; c.burn=COFFEE.burnPause; c.needRelease=true; c.shake=0.45; SFX.burn(); say('אח! חם! לגימות קטנות', 1.1, 'yael'); setPose('spill', 0.6); return updateGoal(); }
    const floor = c.part==='A' ? COFFEE.halfAt : 0; const dps = c.part==='B' ? (COFFEE.halfAt/COFFEE.drinkSecondsB) : (1/COFFEE.drinkSeconds);
    c.amount=Math.max(floor, c.amount-dt*dps);
    if(play.pose!=='celebrate' && play.pose!=='spill'){ play.pose='drink'; play.poseT=0.45; } // lingers after release, so taps do not jerk the cup
    c.sipT=(c.sipT||0)+dt; if(c.sipT>=0.9){ c.sipT=0; SFX.sip(); }
    if(c.part==='A' && c.amount<=COFFEE.halfAt && c.temp>=c.min && !c.card){ c.holding=false; SFX.ting(); c.card={kind:'meeting', src:'person', who:L3_MEETING_CARD[0], text:L3_MEETING_CARD[1], answers:['באה'], timer:999}; setPose('lookup',999); SFX.pop(); }
    if(c.part==='B' && c.amount<=0 && c.temp>=c.min){ c.holding=false; SFX.win(); winNow(); }
  }
  // distractions
  if(!c.card && play.pause<=0 && play.t>=c.nextAt && !(c.part==='A' && c.amount<=COFFEE.halfAt)) spawnDistraction();
  if(c.correctFx){ c.correctFx.t-=dt; if(c.correctFx.t<=0){ c.correctFx=null; closeCard(true); } }
  if(c.spill>0) c.spill-=dt; if(c.cold>0) c.cold-=dt; if(c.wrong>0) c.wrong-=dt; if(c.shake>0) c.shake-=dt; if(c.bonusT>0) c.bonusT-=dt; c.steam+=dt;
  if(!L3_REDUCED) for(const p of c.papers){ p.y+=p.vy*dt; p.x+=(p.vx+Math.sin(c.steam*0.7+p.r)*6)*dt; p.r+=p.vr*dt; if(p.y>300){ p.y=100; p.x=40+Math.random()*190; } }
  updateGoal();
}
function coffeeDown(e){
  if(play.over||play.won) return; if(play.coffee.correctFx) return; if(play.coffee.part==='meeting'||play.coffee.part==='mid') return;
  const c=play.coffee, p=l3pt(e);
  if(c.card){
    const R=cardRects();
    if(inRect(p,R.xbtn)){ closeCard(true); return; }
    if(c.card.kind==='meeting'){ if(inRect(p,R.btn[0])){ SFX.tap(); startMeeting(); } return; }
    if(c.card.kind==='question'){ for(let i=0;i<2;i++) if(inRect(p,R.btn[i])){ c.btnDown=i; SFX.tap(); return; } return; }
    if(c.card.kind==='person'){ if(inRect(p,R.card)) closeCard(true); return; }
    if(inRect(p,R.card)){ c.ptr={x:p.x,y:p.y}; }
    return;
  }
  if(inRect(p,L3.cupRect)){ c.holding=true; }
}

  if(line) lines.push(line); return lines;
}

  tick();
}
/* positions per layout. x,y in logical pixels (270x360) */
function titlePlan(){
  if(TITLE.layout==='C'){
    const badges=[], cx=135, cy=200, rx=118, ry=128;
    /* an open ring around Yael: from lower-left, over the top, to lower-right */
    /* two arcs, left 7 and right 6, so the top of Yael's head stays clear */
    for(let i=0;i<7;i++){ const a=Math.PI*(0.90+0.50*i/6); badges.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); }
    for(let i=0;i<6;i++){ const a=Math.PI*(1.62+0.48*i/5); badges.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); }
    return { badges, bs:30,
      items:[['item_coffee',26,82,24],['ui_bus_marker',240,96,28],['item_carbs',204,196,24],['item_phone',204,146,26],['item_guava',250,276,22]],
      nitzan:[64,318], yotam:[192,322], chupa:[132,324], yael:[138,300], yaelBig:[-140,20], yaelHero:[3,62],
      kidScale:0.46, nitzanScale:0.40 };
  }
  const badges=[];
  for(let i=0;i<7;i++) badges.push([19, 84+i*33]);
  for(let i=0;i<6;i++) badges.push([251, 100+i*33]);
  return { badges, bs:30, items:[], nitzan:[74,296], yotam:[208,306], chupa:[66,312], yael:[138,300] };
}
function titleDraw(){
  const K=TITLE.K, c=TITLE.ctx, W=270, H=TITLE.H;
  const still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t=still?0:(performance.now()-TITLE.t0)/1000;
  const P=titlePlan();
  c.setTransform(K,0,0,K,0,0); c.imageSmoothingEnabled=false;
  /* background */
  c.fillStyle='#15112b'; c.fillRect(0,0,W,H);
  const bx=138, by=178;
  c.save(); c.translate(bx,by); c.rotate(t*0.08);
  for(let i=0;i<16;i++){ c.beginPath(); c.moveTo(0,0); c.arc(0,0,320,i*Math.PI/8,(i+0.5)*Math.PI/8); c.closePath(); c.fillStyle=i%2?'#2d2560':'#231c45'; c.fill(); }
  c.restore();
  let g=c.createRadialGradient(bx,by,8,bx,by,150);
  g.addColorStop(0,'rgba(245,192,74,0.55)'); g.addColorStop(0.35,'rgba(127,119,221,0.28)'); g.addColorStop(1,'rgba(21,17,43,0)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  /* sparkles */
  TITLE.spark.forEach(s=>{ const a=0.5+0.5*Math.sin(t*2.2+s.p); if(a<0.15) return; const r=s.s*(0.6+a);
    c.fillStyle=`rgba(255,240,190,${0.35+0.6*a})`; c.fillRect(s.x-r,s.y-0.5,r*2,1); c.fillRect(s.x-0.5,s.y-r,1,r*2); });
  /* floating items (layout C) */
  P.items.forEach(([n,x,y,s],i)=>{ const im=TITLE.img[n]; if(!im.complete||!im.naturalWidth) return;
    const dy=Math.round(Math.sin(t*1.6+i*1.3)*2); c.drawImage(im, Math.round(x-s/2), Math.round(y-s/2+dy), s, s); });
  /* Yael first, then the family in front of her (her hair would hide Nitzan's face) */
  const intro=(id,[x,y])=>{ const SC=(id==='nitzan'?P.nitzanScale:P.kidScale)||0.355; /* intro_* files are 512 px, feet at 480 */ const im=TITLE.img['intro_'+id]; if(!im.complete||!im.naturalWidth) return;
    const s=512*SC; c.drawImage(im, Math.round(x-s/2), Math.round(y-480*SC), Math.round(s), Math.round(s)); };
  const shadow=(x,y,w)=>{ c.fillStyle='rgba(0,0,0,0.35)'; c.beginPath(); c.ellipse(x,y,w,w*0.22,0,0,6.283); c.fill(); };
  /* tier 1: Yael, 256 px sprite at 1:1, feet at y=240 in the file */
  const bob=Math.round(Math.sin(t*2.4)*1.5);
  const yi=TITLE.img.yael_ready;
  const hi=TITLE.img.title_yael_hero;
  if(P.yaelHero&&hi.complete&&hi.naturalWidth){ /* title_yael_hero.png, 768x768 from ChatGPT (25.11.2026), shown at 1/3 = 1:1 canvas pixels */
    c.drawImage(hi, P.yaelHero[0], P.yaelHero[1]+bob, 256, 256);
  } else if(P.yaelBig){ /* head to waist, 2x (whole pixels), Nitzan asked for a bigger, dramatic Yael (25.11.2026) */
    if(yi.complete&&yi.naturalWidth) c.drawImage(yi, P.yaelBig[0], P.yaelBig[1]+bob, 512, 512);
  } else {
    shadow(P.yael[0],P.yael[1],40);
    if(yi.complete&&yi.naturalWidth) c.drawImage(yi, P.yael[0]-128, P.yael[1]-240+bob, 256, 256);
  }
  shadow(P.nitzan[0],P.nitzan[1],26); intro('nitzan',P.nitzan);
  shadow(P.chupa[0],P.chupa[1],18); intro('chupa',P.chupa);
  shadow(P.yotam[0],P.yotam[1],20); intro('yotam',P.yotam);
  /* bottom fade (start button area) */
  g=c.createLinearGradient(0,296,0,H); g.addColorStop(0,'rgba(21,17,43,0)'); g.addColorStop(0.55,'rgba(21,17,43,0.92)'); g.addColorStop(1,'#15112b');
  c.fillStyle=g; c.fillRect(0,296,W,H-296);
  /* tier 3: 13 small portrait badges (cream frame is inside the portrait files) */
  c.imageSmoothingEnabled=true;
  P.badges.forEach(([x,y],i)=>{ const im=TITLE.img[TITLE.tier3[i]+'_portrait']; if(!im.complete||!im.naturalWidth) return;
    const s=P.bs, dy=Math.round(Math.sin(t*1.8+i*0.9)*1.2), bx0=Math.round(x-s/2), by0=Math.round(y-s/2+dy);
    c.fillStyle='rgba(0,0,0,0.45)'; c.fillRect(bx0+1.5,by0+2,s,s);
    c.drawImage(im, bx0, by0, s, s); });
  c.imageSmoothingEnabled=false;
  /* title band */
  g=c.createLinearGradient(0,0,0,70); g.addColorStop(0,'rgba(13,10,30,0.92)'); g.addColorStop(0.75,'rgba(13,10,30,0.55)'); g.addColorStop(1,'rgba(13,10,30,0)');
  c.fillStyle=g; c.fillRect(0,0,W,70);
  const pulse=still?1:1+Math.sin(t*2.6)*0.025;
  c.save(); c.translate(W/2,30); c.scale(pulse,pulse);
  c.direction='rtl'; c.textAlign='center'; c.textBaseline='middle';
  c.font="900 32px Heebo, system-ui, sans-serif";
  c.lineJoin='round'; c.lineWidth=7; c.strokeStyle='#2d1b4e'; c.strokeText('היום של יעל',0,1);
  c.shadowColor='rgba(245,192,74,0.75)'; c.shadowBlur=10;
  const tg=c.createLinearGradient(0,-16,0,16); tg.addColorStop(0,'#fff2b8'); tg.addColorStop(0.5,'#f5c04a'); tg.addColorStop(1,'#e0912a');
  c.fillStyle=tg; c.fillText('היום של יעל',0,0);
  c.restore();
  c.direction='rtl'; c.textAlign='center'; c.textBaseline='middle';
  c.font="700 11px Heebo, system-ui, sans-serif"; c.fillStyle='#b9b0e6';
  c.fillText('מצאת החמה עד צאת הכוחות',W/2,54);
}
